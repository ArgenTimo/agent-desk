[tool.poetry]
name = "agent-desk"
version = "0.0.0"
description = "A read-first console over the Claude Code sessions running on this machine."
authors = ["agent-desk"]
readme = "README.md"
packages = [{ include = "agent_desk" }]
# The secret shapes the store redacts with, so an installed copy has them too. The checkout's
# `.claude/security-patterns.yaml` still wins when there is one — this is the fallback that makes
# `pip install agent-desk` work at all, and `make check-patterns` fails when the two drift.
include = [{ path = "agent_desk/security-patterns.yaml", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = "^3.12"

# The console. design/01-module-layout.md `web/`. Server-rendered: HTMX and SSE come over the
# wire, so there is no JavaScript build step (docs/adr/0003).
fastapi = "^0.141"
# Named directly, though fastapi is what pulls it in. Eight advisories were open against the
# version that came along for the ride (`pip-audit`, 2026-09), and a floor you inherit is a floor
# that moves when somebody else's constraint moves. This one is ours.
starlette = ">=1.3.1"
uvicorn = { version = "^0.34", extras = ["standard"] }
jinja2 = "^3.1"

# Configuration and the types `observe` hands downstream. Every shape read off disk is validated
# at the boundary rather than trusted (docs/adr/0004).
pydantic = "^2.10"
pydantic-settings = "^2.7"
# .claude/security-patterns.yaml is a YAML file and store/redact.py reads it.
pyyaml = "^6.0"

# One SQLite file, one process. docs/adr/0003 is why this is not Postgres.
sqlalchemy = { version = "^2.0", extras = ["asyncio"] }
aiosqlite = "^0.20"

# ULIDs sort by time, which makes a list of blocks chronological without an index.
python-ulid = "^3.0"

# Structured from the first line, with redaction installed at the logger.
structlog = "^25.1"

# Deliberately absent: httpx (this process makes no outbound calls — docs/07-security.md),
# alembic (plain SQL at startup — docs/adr/0003), and anything that would need a build step.

[tool.poetry.group.dev.dependencies]
ruff = "^0.9"
mypy = "^1.14"
pytest = "^9.1"
pytest-asyncio = "^1.3"
pytest-cov = "^6.0"
# What `make audit` runs. Dev-group, and not in `verify`: both want the network, and a gate that
# fails on a train is a gate people learn to skip.
pip-audit = "^2.7"
bandit = "^1.8"
types-pyyaml = "^6.0"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tooling. These settings are the local gate, and .claude/hooks/stop-verify.sh runs the same
# commands at every turn end, so a green turn and a green `make gate` mean the same thing.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["agent_desk", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "UP",        # pyupgrade
    "B",         # bugbear
    "ASYNC",     # blocking IO in an async path — here it stalls the whole console
    "S",         # bandit
    "T20",       # print() in a process that logs structurally
    "RUF",
]
ignore = [
    "E501",      # line length is the formatter's business
    # Titles, prompts and ideas are written in Russian as often as in English, so Cyrillic in
    # strings is expected data rather than a homoglyph smell.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures carry token-shaped strings on purpose, so the redaction tests have something to redact.
# assert is what a test is written in.
"tests/**" = ["S101", "S105", "S106", "S108"]
# A command-line check reports to the operator on stdout; printing is what it is for.
"scripts/*.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.bandit]
# Two checks are switched off here rather than annotated at forty call sites, and each has a
# reason and a test.
#
# B404 — "you imported subprocess". Starting a process is what `dispatch.py` and `land.py` are
#        for. The finding is the import, not a use of it.
# B603 — "subprocess call: check for untrusted input". Every call in this program passes a *list*
#        with no shell, and the binary is resolved from settings or `shutil.which`. What that
#        check is really about is `shell=True`, and
#        `tests/unit/test_security_surface.py::test_nothing_is_ever_handed_to_a_shell` asserts
#        against the syntax tree of every module that it is never passed anywhere.
#
# Everything else stays on. B310 (url schemes) and B704 (Markup) are annotated where they occur,
# next to the guard that makes them safe — a report short enough to read is a report somebody
# reads, and one with a dozen known-good findings in it is one nobody does.
skips = ["B404", "B603"]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, a missing tests/ makes pytest search from the current directory — which means the
# virtualenv, and collecting a dependency's own suite.
norecursedirs = [".venv", ".git", "docs", "design", ".claude"]
asyncio_mode = "auto"
addopts = "--strict-markers"
# One marker. Nothing here needs a service: the only external dependency is the filesystem, and a
# filesystem is faked with tmp_path (design/01-module-layout.md, "Tests").
markers = [
    "unit: no external dependency; runs in the Stop hook on every turn end",
]

[tool.coverage.run]
source = ["agent_desk"]
branch = true
